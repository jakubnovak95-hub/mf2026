<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trask-Intralog – řízení skladu a intralogistiky</title>
<style>
:root{
  --bg:#e6e9eb; --surface:#ffffff; --surface2:#f3f5f6; --ink:#17202a; --muted:#56626d;
  --line:#cbd2d8; --line2:#aeb8c1;
  --navy:#1f3b5c; --navy-ink:#ffffff;
  --yellow:#f2c200; --yellow-ink:#2a2200;
  --ok:#2f7d4a; --warn:#b86e00; --late:#c3302a;
  --c-free-bg:#f6f8f9; --c-free-bd:#aeb8c1;
  --c-part-bg:#cfe1f3; --c-part-bd:#5d8fc0;
  --c-full-bg:#1f3b5c; --c-full-ink:#ffffff; --c-full-bd:#14283f;
  --c-res-a:#fff1b8; --c-res-b:#f2c200; --c-res-bd:#a88600;
  --A:#2f6db5; --B:#6a4bc4; --C:#b4561c;
  --shadow:0 1px 0 rgba(23,32,42,.06);
  --head:"Barlow Semi Condensed","Barlow","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --trask-logo:#002233; --trask-link:#0055ff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14191e; --surface:#1d242b; --surface2:#242c34; --ink:#e7ebee; --muted:#9aa6b1;
    --line:#333d47; --line2:#46525e;
    --navy:#7fb0e6; --navy-ink:#0c1724;
    --yellow:#e8b900; --yellow-ink:#1d1700;
    --ok:#5fbf7f; --warn:#e3a33a; --late:#ff6b62;
    --c-free-bg:#1a2128; --c-free-bd:#4a5662;
    --c-part-bg:#1f3a57; --c-part-bd:#5d93cc;
    --c-full-bg:#7fb0e6; --c-full-ink:#0c1724; --c-full-bd:#a9cbf0;
    --c-res-a:#3f3508; --c-res-b:#6b5806; --c-res-bd:#e8b900;
    --A:#78aef0; --B:#a990f0; --C:#ec9a62;
    --shadow:none; --trask-logo:#ffffff; --trask-link:#7aa7ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14191e; --surface:#1d242b; --surface2:#242c34; --ink:#e7ebee; --muted:#9aa6b1;
  --line:#333d47; --line2:#46525e;
  --navy:#7fb0e6; --navy-ink:#0c1724;
  --yellow:#e8b900; --yellow-ink:#1d1700;
  --ok:#5fbf7f; --warn:#e3a33a; --late:#ff6b62;
  --c-free-bg:#1a2128; --c-free-bd:#4a5662;
  --c-part-bg:#1f3a57; --c-part-bd:#5d93cc;
  --c-full-bg:#7fb0e6; --c-full-ink:#0c1724; --c-full-bd:#a9cbf0;
  --c-res-a:#3f3508; --c-res-b:#6b5806; --c-res-bd:#e8b900;
  --A:#78aef0; --B:#a990f0; --C:#ec9a62;
  --shadow:none; --trask-logo:#ffffff; --trask-link:#7aa7ff;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.1}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
.top-in{display:flex;align-items:center;gap:20px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{display:flex;color:var(--trask-logo);flex:none;padding-right:12px;border-right:1px solid var(--line)}
.tlogo{height:26px;width:auto;display:block}
.site-foot{border-top:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px}
.site-foot-in{max-width:1700px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:center}
.site-foot .tlogo{height:14px;color:var(--trask-logo)}
.site-foot a{color:var(--trask-link);font-weight:600}
.site-foot .push{margin-left:auto}
body.v-sk .site-foot{background:var(--sk-bg);color:var(--sk-mut);border-top:3px solid var(--sk-bd);font-size:15px;padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}
body.v-sk .site-foot a{color:var(--sk-ink)}
body.v-sk .site-foot-in{max-width:640px;padding:14px 12px}
.brand h1{font-size:24px;font-weight:700;letter-spacing:.2px}
.brand p{margin:0;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-left:8px}
.tabs a{padding:7px 12px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:600}
.tabs a:hover{background:var(--surface2);color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--navy);color:var(--navy-ink)}
.kpis{display:flex;gap:14px;margin-left:auto;font-size:13px;color:var(--muted);flex-wrap:wrap}
.kpis b{display:block;font:700 18px var(--head);color:var(--ink)}
.clock{font:600 18px var(--head)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:6px 11px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.2}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.agv{border-color:var(--yellow);background:var(--yellow);color:var(--yellow-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.small{padding:4px 8px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

main{padding:16px 20px 40px;max-width:1700px;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}

/* legend */
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.legend .item{display:flex;align-items:center;gap:7px}
.sw{width:22px;height:16px;border-radius:3px;border:1px solid var(--line2);flex:none}
.sw.free{background:var(--c-free-bg);border:1px dashed var(--c-free-bd)}
.sw.part{background:var(--c-part-bg);border-color:var(--c-part-bd)}
.sw.full{background:var(--c-full-bg);border-color:var(--c-full-bd)}
.sw.res{background:repeating-linear-gradient(135deg,var(--c-res-b) 0 4px,var(--c-res-a) 4px 8px);border-color:var(--c-res-bd)}
.legend .note{margin-left:auto;color:var(--muted)}

/* hall */
.hall{display:grid;grid-template-columns:minmax(220px,1fr) 176px minmax(400px,2.3fr) 176px minmax(270px,1.35fr);gap:0;align-items:stretch;min-height:560px}
.zone{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.zone-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.zone-head h2{font-size:22px;font-weight:700}
.zone-head .sub{color:var(--muted);font-size:13px}
.zone-head .btn{margin-left:auto}
.empty{color:var(--muted);font-size:14px;padding:12px;border:1px dashed var(--line2);border-radius:8px;text-align:center}

/* lanes – painted aisle */
.lane{position:relative;padding:14px 10px;display:flex;flex-direction:column;gap:10px;min-width:0;
  background:linear-gradient(90deg,transparent 6px,var(--yellow) 6px 9px,transparent 9px calc(100% - 9px),var(--yellow) calc(100% - 9px) calc(100% - 6px),transparent calc(100% - 6px))}
.lane-head{text-align:center;font:700 15px var(--head);color:var(--muted)}
.lane-head span{display:block;font:500 12px var(--body)}
.lane .empty{font-size:12px;background:color-mix(in srgb,var(--bg) 70%,transparent)}

.pcard,.tcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.tcard{border-left:4px solid var(--navy)}
.tcard.m-AGV{border-left-color:var(--yellow)}
.row{display:flex;align-items:center;gap:8px}
.row .grow{flex:1;min-width:0}
.pid{border:0;background:none;padding:0;font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.pid:hover{text-decoration-color:currentColor}
.pack{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:4px;font:700 13px var(--head);color:#fff}
.pack-A{background:var(--A)} .pack-B{background:var(--B)} .pack-C{background:var(--C)}
:root[data-theme="dark"] .pack{color:#0c1724}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pack{color:#0c1724}}
.pname{font-weight:600;line-height:1.25}
.meta{color:var(--muted);font-size:13px}
.wbar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.wbar span{display:block;height:100%;background:var(--ok)}
.okline{font-size:13px;color:var(--ok);font-weight:600}
.mode{font:700 12px var(--head);padding:2px 6px;border-radius:4px;background:var(--surface2);border:1px solid var(--line2)}
.mode.AGV{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow)}
.prog{height:8px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.prog span{display:block;height:100%;background:var(--yellow);transition:width .45s linear}
.prog.manual span{width:100%!important;background:repeating-linear-gradient(90deg,var(--navy) 0 10px,transparent 10px 20px);background-size:20px 100%;animation:roll 1s linear infinite;opacity:.55}
@keyframes roll{to{background-position:20px 0}}
.route{font-size:13px}
.route b{font-family:var(--head)}

/* warehouse */
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font:700 16px var(--head)}
.rack{border-top:1px solid var(--line);padding-top:10px}
.rack-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.rack-head h3{font-size:17px}
.rack-head span{color:var(--muted);font-size:13px}
.cells{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr))}
.cell{position:relative;text-align:left;border:1px solid var(--line2);border-radius:6px;padding:7px 8px;cursor:pointer;min-height:var(--ch);display:flex;flex-direction:column;gap:3px;background:var(--surface)}
.cell .cid{font:700 14px var(--head)}
.cell .cmat{font-size:12.5px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cell .ccap{font-size:12px;color:var(--muted);margin-top:auto}
.cell.free{background:var(--c-free-bg);border:1px dashed var(--c-free-bd)}
.cell.free .cmat{color:var(--muted)}
.cell.part{background:var(--c-part-bg);border-color:var(--c-part-bd)}
.cell.full{background:var(--c-full-bg);border-color:var(--c-full-bd);color:var(--c-full-ink)}
.cell.full .ccap{color:inherit;opacity:.8}
.cell.res{background:repeating-linear-gradient(135deg,var(--c-res-b) 0 6px,var(--c-res-a) 6px 14px);border:2px solid var(--c-res-bd);color:var(--ink)}
.cell.res .cmat{background:var(--c-res-a);border-radius:3px;padding:0 3px;align-self:flex-start}
.cell:hover{filter:brightness(.97)}
.pips{display:flex;gap:3px;margin-top:auto;flex-wrap:wrap}
.pip{width:11px;height:11px;border-radius:2px;border:1px solid currentColor;opacity:.75}
.pip.on{background:currentColor;opacity:1}
.pip.rs{background:var(--yellow);border-color:var(--c-res-bd);opacity:1}
.cell.full .pip.on{background:var(--c-full-ink)}
.cell .flag{position:absolute;top:6px;right:6px;font:700 11px var(--head);padding:1px 4px;border-radius:3px;background:var(--yellow);color:var(--yellow-ink)}

/* production */
.ws{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.ws-head{display:flex;align-items:center;gap:8px}
.ws-head h3{font-size:18px;flex:1}
.rq{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:9px;display:flex;flex-direction:column;gap:6px}
.rq.late{border-color:var(--late)}
.cd{font:700 15px var(--head);white-space:nowrap}
.cd.ok{color:var(--ok)} .cd.warn{color:var(--warn)} .cd.late{color:var(--late)}
.why{font-size:13px;background:var(--surface2);border-left:3px solid var(--navy);padding:6px 8px;border-radius:0 5px 5px 0}
.why.wait{border-left-color:var(--warn)}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.done{font-size:13px;display:flex;flex-direction:column;gap:3px;border-top:1px dashed var(--line2);padding-top:6px}
.done .row{gap:6px}
.tag{font-size:12px;font-weight:600;padding:1px 6px;border-radius:10px;border:1px solid currentColor}
.tag.ok{color:var(--ok)} .tag.late{color:var(--late)}

/* tables & tabs */
.page h2{font-size:24px;margin-bottom:6px}
.page p.lead{color:var(--muted);margin:0 0 14px;max-width:75ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
.box{padding:16px}
.box h3{font-size:19px;margin-bottom:10px}
.box p,.box li{max-width:75ch}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--head);font-weight:700;font-size:14px;color:var(--muted);background:var(--surface2)}
td.c,th.c{text-align:center}
tr.clk{cursor:pointer} tr.clk:hover td{background:var(--surface2)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.st{display:inline-block;padding:3px 9px;border-radius:12px;font-size:13px;font-weight:600;border:1px solid var(--line2);background:var(--surface2);white-space:nowrap}
.st.PRIJEM{border-color:var(--C)} .st.CESTA_SKLAD,.st.CESTA_VYROBA{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow)}
.st.SKLAD{background:var(--c-part-bg);border-color:var(--c-part-bd)} .st.VYROBA{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
ol.steps{margin:0;padding-left:22px} ol.steps li{margin:4px 0}
.log{max-height:560px;overflow:auto;font-size:13.5px}
.log div{padding:6px 2px;border-bottom:1px solid var(--line);display:flex;gap:10px}
.log time{color:var(--muted);flex:none;width:92px}

/* modal */
.backdrop{position:fixed;inset:0;background:rgba(10,15,20,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:12px;width:min(620px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;border:1px solid var(--line)}
.modal h2{font-size:24px;margin-bottom:4px}
.modal .x{float:right}
.target{display:flex;align-items:center;gap:14px;margin:14px 0;padding:12px 14px;border-radius:8px;background:repeating-linear-gradient(135deg,var(--c-res-b) 0 6px,var(--c-res-a) 6px 14px);border:2px solid var(--c-res-bd)}
.target b{font:700 34px var(--head);background:var(--c-res-a);padding:0 8px;border-radius:5px}
.target span{background:var(--c-res-a);padding:2px 6px;border-radius:4px;font-size:14px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.choice .btn{flex-direction:column;align-items:flex-start;padding:12px;text-align:left}
.choice .btn small{font-weight:400;font-size:12.5px;opacity:.85}
.field{display:flex;flex-direction:column;gap:4px;margin:12px 0}
.field label{font-weight:600}
.field select,.field input{font:inherit;padding:8px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);color:var(--ink)}
.msg{font-size:14px;padding:8px 10px;border-radius:6px;margin-top:8px}
.msg.err{background:color-mix(in srgb,var(--late) 14%,transparent);color:var(--late);font-weight:600}
.msg.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:5px 12px;font-size:14px;margin:12px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.hist{font-size:13.5px;border-left:2px solid var(--line2);margin:8px 0 0 4px;padding-left:12px}
.hist div{margin:5px 0}
.hist time{color:var(--muted);margin-right:6px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;max-width:340px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.toast.err{background:var(--late);color:#fff}

details.howto{margin-bottom:14px}
details.howto summary{cursor:pointer;font-weight:600;padding:10px 14px}
details.howto ol{margin:0 14px 12px;padding-left:20px;font-size:14px}

@media (max-width:1240px){
  .hall{grid-template-columns:1fr;gap:0}
  .lane{flex-direction:row;flex-wrap:wrap;align-items:flex-start;padding:16px 10px;background:linear-gradient(180deg,transparent 6px,var(--yellow) 6px 9px,transparent 9px calc(100% - 9px),var(--yellow) calc(100% - 9px) calc(100% - 6px),transparent calc(100% - 6px))}
  .lane-head{width:100%;text-align:left}
  .lane .tcard{width:220px}
  .lane .empty{flex:1}
}
@media (max-width:640px){
  .top-in{padding:10px 12px;gap:10px}
  .kpis{margin-left:0;width:100%}
  main{padding:12px}
  .grid2{grid-template-columns:1fr}
  .choice{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .legend .note{margin-left:0}
}
/* ---------- přepínač pohledů ---------- */
.viewswitch{display:flex;border:2px solid var(--navy);border-radius:8px;overflow:hidden;flex:none}
.viewswitch a{padding:7px 16px;font:700 16px var(--head);text-decoration:none;color:var(--navy)}
.viewswitch a[aria-current="page"]{background:var(--navy);color:var(--navy-ink)}

/* ---------- pohled Skladník ---------- */
:root{--sk-bg:#ffffff;--sk-card:#ffffff;--sk-ink:#000000;--sk-mut:#24282c;--sk-bd:#000000;--sk-ok:#00702a;--sk-err:#c8001c;--sk-amber:#ffd400;--sk-blue:#0b3a75;--sk-off:#e9ebed}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sk-bg:#000000;--sk-card:#0d0d0d;--sk-ink:#ffffff;--sk-mut:#e2e5e8;--sk-bd:#ffffff;--sk-ok:#3ee07c;--sk-err:#ff5a6a;--sk-blue:#2f6fd6;--sk-off:#1c1f22}}
:root[data-theme="dark"]{--sk-bg:#000000;--sk-card:#0d0d0d;--sk-ink:#ffffff;--sk-mut:#e2e5e8;--sk-bd:#ffffff;--sk-ok:#3ee07c;--sk-err:#ff5a6a;--sk-blue:#2f6fd6;--sk-off:#1c1f22}
body.v-sk{background:var(--sk-bg);color:var(--sk-ink);font-size:20px}
body.v-sk .tabs,body.v-sk .kpis,body.v-sk .clock,body.v-sk .brand p{display:none}
body.v-sk .top{background:var(--sk-bg);border-bottom:3px solid var(--sk-bd)}
body.v-sk::before{background:var(--sk-bg)}
body.v-sk .top-in{padding:8px 12px;gap:10px}
body.v-sk .viewswitch{border-color:var(--sk-bd)}
body.v-sk .viewswitch a{padding:10px 18px;font-size:19px;color:var(--sk-ink)}
body.v-sk .viewswitch a[aria-current="page"]{background:var(--sk-ink);color:var(--sk-bg)}
body.v-sk .reset{margin-left:auto;font-size:13px;padding:6px 8px;background:var(--sk-card);color:var(--sk-ink);border-color:var(--sk-bd)}
body.v-sk main{max-width:640px;padding:12px 12px 24px}
.sk-title{display:flex;align-items:baseline;gap:10px;font:700 30px var(--head);margin:4px 0 10px}
.sk-group{font:700 19px var(--head);margin:16px 0 8px;color:var(--sk-mut)}
.sk-list{display:flex;flex-direction:column;gap:10px}
.sk-card{position:relative;display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;background:var(--sk-card);color:var(--sk-ink);border:3px solid var(--sk-bd);border-left-width:14px;border-radius:12px;padding:12px 14px;cursor:pointer}
.sk-card.V{border-left-color:var(--sk-blue)}
.sk-card.Z{border-left-color:#7a8590}
.sk-card.first{box-shadow:0 0 0 5px var(--sk-amber)}
.sk-card.off{background:var(--sk-off)}
.sk-card.is-late{border-color:var(--sk-err)}
.sk-next{align-self:flex-start;background:var(--sk-amber);color:#000;font:700 16px var(--head);padding:2px 8px;border-radius:6px;margin-bottom:2px}
.sk-new{align-self:flex-start;background:var(--sk-err);color:#fff;font:700 16px var(--head);padding:2px 8px;border-radius:6px}
.sk-type{font:700 17px var(--head);color:var(--sk-mut)}
.sk-main{font:700 27px/1.15 var(--head)}
.sk-sub{font-size:18px}
.sk-cd{font:700 30px var(--head);align-self:flex-start}
.sk-cd.ok{color:var(--sk-ok)}
.sk-cd.last{color:var(--sk-err)}
.sk-cd.late{background:var(--sk-err);color:#fff;padding:2px 10px;border-radius:6px;animation:skpulse 1s steps(2) infinite}
@keyframes skpulse{50%{outline:4px solid var(--sk-err);outline-offset:3px}}
.sk-empty{border:3px dashed var(--sk-bd);border-radius:12px;padding:24px;text-align:center;font-size:20px}
.sk-head{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.sk-backbtn{min-height:54px;padding:0 16px;font:700 20px var(--head);border:3px solid var(--sk-bd);border-radius:10px;background:var(--sk-card);color:var(--sk-ink);cursor:pointer}
.sk-label{font:700 24px var(--head);margin-top:6px}
.sk-big{font:700 clamp(64px,22vw,104px)/1 var(--head);margin:4px 0 6px;word-break:break-word}
.sk-big.mid{font-size:clamp(48px,15vw,72px)}
.sk-text{font-size:21px}
.sk-reason{border:3px solid var(--sk-bd);border-radius:10px;padding:12px 14px;font-size:18px;margin-top:14px}
.sk-reason b{display:block;font:700 20px var(--head);margin-bottom:4px}
.sk-reason ol{margin:6px 0 0;padding-left:22px}
.sk-reason li{margin:4px 0}
.sk-reason.err{border-color:var(--sk-err);color:var(--sk-err)}
.sk-prio{display:block;width:100%;text-align:left;background:var(--sk-err);color:#fff;border:0;border-radius:10px;padding:12px 14px;font:700 19px/1.25 var(--head);margin-bottom:12px;cursor:pointer}
.sk-prio .sk-cd{display:block;color:#fff;background:none;animation:none;padding:0;font-size:24px}
.sk-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sk-bg);border-top:3px solid var(--sk-bd);padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.sk-bar-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.sk-btn{min-height:78px;width:100%;border-radius:12px;border:3px solid var(--sk-bd);font:700 27px var(--head);background:var(--sk-card);color:var(--sk-ink);cursor:pointer}
.sk-btn.main{background:var(--sk-blue);border-color:var(--sk-blue);color:#fff}
.sk-btn.agv{background:var(--sk-amber);border-color:#000;color:#000}
.sk-hint{font-size:16px;text-align:center;color:var(--sk-mut)}
.sk-hint b{font-family:var(--head);font-size:18px}
.sk-flash{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;cursor:pointer}
.sk-flash.ok{background:#00702a}
.sk-flash.err{background:#c8001c}
.sk-flash .ic{font:700 110px/1 var(--head)}
.sk-flash h2{font-size:38px}
.sk-flash .bigc{font:700 clamp(64px,22vw,110px)/1 var(--head);background:#fff;color:#c8001c;padding:4px 18px;border-radius:12px}
.sk-flash p{font-size:23px;max-width:26ch;margin:0}
.sk-flash button{min-height:78px;width:min(600px,100%);border:3px solid #fff;background:transparent;color:#fff;font:700 27px var(--head);border-radius:12px;margin-top:14px;cursor:pointer}
.sk-alert{position:fixed;left:0;right:0;top:0;z-index:70;background:var(--sk-amber);color:#000;border-bottom:8px solid #c8001c;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 16px;animation:skalert .5s steps(2) 6}
.sk-alert-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.sk-alert h2{font-size:30px}
.sk-alert p{margin:0;font-size:21px}
.sk-alert .row2{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-top:6px}
.sk-alert .sk-btn{min-height:70px;font-size:23px;border-color:#000;background:#fff;color:#000}

<script>
/* ---------- konstanty pravidel ---------- */
const STORAGE_KEY = 'skladflow-state-v1';
const AGV_MS = 15000;
const PACK = {
  A: {desc: 'malý přepravní box', max: 15},
  B: {desc: 'velký přepravní box', max: 40},
  C: {desc: 'paleta', max: 800}
};
const CELLTYPE = {
  5: {name: 'malá police', cap: {A: 1}},
  3: {name: 'střední police', cap: {A: 2, B: 1}},
  1: {name: 'paletové místo', cap: {A: 4, B: 2, C: 1}}
};
const ORDER = {A: [5, 3, 1], B: [3, 1], C: [1]};
const STATES = {
  PRIJEM: 'Na příjmu', CESTA_SKLAD: 'Na cestě do skladu', SKLAD: 'Zaskladněno',
  CESTA_VYROBA: 'Na cestě do výroby', VYROBA: 'Ve výrobě'
};
const WS = {L1: 'Linka 1', L2: 'Linka 2', MON: 'Montáž'};
const MODES = {AGV: 'AGV', RUCNI: 'Ručně vedený vozík'};
const RACKS = [
  {id: 'R1', type: 1, count: 4, cw: '130px', ch: '96px'},
  {id: 'R2', type: 3, count: 6, cw: '108px', ch: '86px'},
  {id: 'R3', type: 5, count: 8, cw: '92px', ch: '80px'}
];

/* ---------- pomocné ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n, l = 4) => String(n).padStart(l, '0');
const kg = n => Number(n).toLocaleString('cs-CZ', {maximumFractionDigits: 1}) + ' kg';
const fmt = ts => {
  const d = new Date(ts);
  return d.toLocaleDateString('cs-CZ', {day: 'numeric', month: 'numeric'}) + ' ' +
         d.toLocaleTimeString('cs-CZ', {hour: '2-digit', minute: '2-digit'});
};
const fmtT = ts => new Date(ts).toLocaleTimeString('cs-CZ', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
const mmss = ms => { const s = Math.floor(Math.abs(ms) / 1000); return pad(Math.floor(s / 60), 2) + ':' + pad(s % 60, 2); };
function dur(ms) {
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (ms < 60000) return Math.max(1, Math.floor(ms / 1000)) + ' s';
  if (m < 60) return m + ' min';
  if (h < 24) return h + ' h ' + (m % 60) + ' min';
  return d + ' d ' + (h % 24) + ' h';
}

let S;
const mat = id => S.materials.find(m => m.id === id);
const P = id => S.packages[id];
const cellById = id => S.cells.find(c => c.id === id);
const cellUsed = c => c.items.length + c.reserved.length;
const cellMaterial = c => { const id = c.items[0] || c.reserved[0]; return id ? P(id).mat : null; };
function cellStatus(c) {
  if (c.reserved.length) return 'res';
  const u = cellUsed(c);
  if (!u) return 'free';
  return u >= CELLTYPE[c.type].cap[mat(cellMaterial(c)).pack] ? 'full' : 'part';
}
const STATUS_LABEL = {free: 'volná', part: 'částečně obsazená', full: 'plná', res: 'rezervovaná'};
function log(text) { S.log.unshift({t: Date.now(), text}); if (S.log.length > 300) S.log.length = 300; }
function hist(p, note) { p.history.push({t: Date.now(), state: p.state, note}); }

/* ---------- ukázková data ---------- */
// Simulace pro pohled Skladník: časovaný požadavek a pořadí skenování
const defaultSim = () => ({requestAt: null, fired: false, putaways: 0, lastCell: null});
function newPkg(st, matId, weight, t) {
  const id = 'OB-' + pad(++st.seq.pkg);
  const m = st.materials.find(x => x.id === matId);
  st.packages[id] = {id, mat: matId, weight, state: 'PRIJEM', receivedAt: t, cell: null, target: null,
    storedAt: null, putReason: null, fifoReason: null, allocatedTo: null, ws: null, fromCell: null,
    deliveredAt: null, onTime: null,
    history: [{t, state: 'PRIJEM', note: `Přijato, hmotnost ${kg(weight)} (max. ${PACK[m.pack].max} kg pro obal ${m.pack})`}]};
  return st.packages[id];
}

  const materials = [

  const st = {version: 1, materials, cells, packages: {}, transports: [], requests: [], log: [], seq: {pkg: 0, tr: 0, req: 0}, sim: defaultSim(), dismissed: []};
  const stored = [

/* ---------- úložiště ---------- */
function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const st = JSON.parse(raw); if (st && st.version === 1 && st.cells) { if (!st.sim) st.sim = defaultSim(); if (!st.dismissed) st.dismissed = []; return st; } }
  } catch (e) {}
  return null;
}

/* ---------- zaskladňovací strategie ---------- */
function findPutaway(p) {
  const m = mat(p.mat), pack = m.pack, order = ORDER[pack];
  const steps = [`Obal ${pack} (${PACK[pack].desc}) se smí uložit do typů buněk ${order.join(' → ')}; postupuje se od nejmenší.`];
  for (const t of order) {
    const ct = CELLTYPE[t], cap = ct.cap[pack];
    const cs = S.cells.filter(c => c.type === t);
    const lbl = `Typ ${t} – ${ct.name} (max. ${cap}× obal ${pack})`;
    const same = cs.find(c => cellUsed(c) > 0 && cellMaterial(c) === p.mat && cellUsed(c) < cap);
    if (same) {
      steps.push(`${lbl}: buňka ${same.id} už obsahuje ${m.name} a má volné místo (obsazeno ${cellUsed(same)} z ${cap}) → má přednost před prázdnou buňkou.`);
      return {cell: same, steps, summary: `Ke stejnému materiálu do ${same.id} (typ ${t}, ${ct.name})`};
    }
    const empty = cs.find(c => cellUsed(c) === 0);
    if (empty) {
      const sameExists = cs.some(c => cellUsed(c) > 0 && cellMaterial(c) === p.mat);
      const freeCount = cs.filter(c => !cellUsed(c)).length;
      steps.push(`${lbl}: ${sameExists ? 'buňky se stejným materiálem jsou plné' : 'žádná buňka se stejným materiálem'}; použita první prázdná buňka ${empty.id} (prázdných ${freeCount} z ${cs.length}).`);
      return {cell: empty, steps, summary: `Prázdná buňka nejmenšího vhodného typu ${t} (${ct.name})`};
    }
    steps.push(`${lbl}: žádné místo – všech ${cs.length} buněk je plných, rezervovaných nebo s jiným materiálem → přechod na větší typ buňky.`);
  }
  steps.push('Ve skladu teď není pro tento obal žádné volné místo.');
  return {cell: null, steps, summary: 'Bez volného místa'};
}

/* ---------- akce ---------- */
function startPutaway(id, mode) {
  const p = P(id); if (!p || p.state !== 'PRIJEM') return;
  const r = findPutaway(p);
  if (!r.cell) { toast('Ve skladu není pro tento obal volné místo.', 'err'); return; }
  r.cell.reserved.push(p.id);
  p.simOrd = ++S.sim.putaways; p.simWrongCell = S.sim.lastCell; S.sim.lastCell = r.cell.id;
  p.target = r.cell.id; p.putReason = {summary: r.summary, steps: r.steps};
  p.state = 'CESTA_SKLAD';
  hist(p, `Rezervována buňka ${r.cell.id}; přeprava: ${MODES[mode]}`);
  S.transports.push({id: 'T' + (++S.seq.tr), pkg: p.id, kind: 'SKLAD', mode, start: Date.now(), from: 'Příjem', to: r.cell.id});
  log(`${p.id} (${mat(p.mat).name}) vyrazil do skladu – rezervována ${r.cell.id}, ${MODES[mode]}.`);
  commit();
}
function completeTransport(trId) {
  const tr = S.transports.find(t => t.id === trId); if (!tr) return;
  S.transports = S.transports.filter(t => t.id !== trId);
  const p = P(tr.pkg), now = Date.now();
  if (tr.kind === 'SKLAD' || tr.kind === 'PRESUN') {
    const c = cellById(tr.to);
    c.reserved = c.reserved.filter(x => x !== p.id); c.items.push(p.id);
    p.cell = c.id; p.state = 'SKLAD';
    if (tr.kind === 'PRESUN') {
      p.relocating = false;   // datum zaskladnění zůstává kvůli FIFO
      hist(p, `Přeskladněno do ${c.id}; datum zaskladnění pro FIFO zachováno`);
      log(`${p.id} přeskladněn z ${tr.from} do ${c.id}.`);
      toast(`${p.id} přeskladněn do ${c.id}`);
    } else {
      p.storedAt = now;
      hist(p, `Zaskladněno v ${c.id}`);
      log(`${p.id} zaskladněn v ${c.id}.`);
      toast(`${p.id} zaskladněn v ${c.id}`);
    }
  } else {
    const rq = S.requests.find(r => r.id === tr.req);
    p.state = 'VYROBA'; p.deliveredAt = now;
    rq.status = 'doruceno'; rq.deliveredAt = now;
    rq.onTime = now <= rq.created + rq.limit * 60000; p.onTime = rq.onTime;
    hist(p, `Doručeno na ${WS[rq.ws]} (${rq.onTime ? 'včas' : 'po limitu'})`);
    log(`${p.id} doručen na ${WS[rq.ws]} pro ${rq.id} – ${rq.onTime ? 'včas' : 'po časovém limitu'}.`);
    toast(`${p.id} doručen na ${WS[rq.ws]}${rq.onTime ? '' : ' (po limitu)'}`, rq.onTime ? '' : 'err');
  }
  commit();
}
function allocate(rq) {
  const cands = Object.values(S.packages)
    .filter(p => p.state === 'SKLAD' && p.mat === rq.mat && !p.allocatedTo)
    .sort((a, b) => a.storedAt - b.storedAt);
  if (!cands.length) return false;
  const p = cands[0], now = Date.now();
  p.allocatedTo = rq.id; rq.pkg = p.id;
  const others = cands.slice(1);
  rq.reason = `Nejdéle ve skladu: zaskladněn ${fmt(p.storedAt)} v ${p.cell} (${dur(now - p.storedAt)}).` +
    (others.length ? ` Novější obaly téhož materiálu: ${others.map(o => `${o.id} v ${o.cell} (${fmt(o.storedAt)})`).join(', ')}.`
                   : ' Jiný volný obal tohoto materiálu ve skladu není.');
  p.fifoReason = rq.reason;
  hist(p, `Vybrán podle FIFO pro požadavek ${rq.id} (${WS[rq.ws]})`);
  log(`FIFO: pro ${rq.id} (${WS[rq.ws]}) vybrán ${p.id} z ${p.cell}.`);
  return true;
}
function createRequest(ws, matId, limit) {
  const rq = {id: 'P-' + pad(++S.seq.req, 3), ws, mat: matId, created: Date.now(), limit, status: 'otevreny', pkg: null, reason: ''};
  S.requests.push(rq);
  log(`${WS[ws]} vyžádala ${mat(matId).name} (${rq.id}), limit ${limit} min.`);
  allocate(rq);
  commit();
}
function dispatch(rqId, mode) {
  const rq = S.requests.find(r => r.id === rqId);
  if (!rq || rq.status !== 'otevreny' || !rq.pkg) return;
  const p = P(rq.pkg), c = cellById(p.cell);
  c.items = c.items.filter(x => x !== p.id);
  p.fromCell = c.id; p.cell = null; p.ws = rq.ws; p.state = 'CESTA_VYROBA';
  hist(p, `Vyskladněno z ${c.id}, buňka uvolněna; přeprava: ${MODES[mode]}`);
  rq.status = 'na_ceste';
  S.transports.push({id: 'T' + (++S.seq.tr), pkg: p.id, kind: 'VYROBA', mode, start: Date.now(), from: c.id, to: WS[rq.ws], req: rq.id});
  log(`${p.id} vyskladněn z ${c.id} pro ${WS[rq.ws]}, ${MODES[mode]}; buňka ${c.id} uvolněna.`);
  commit();
}
function cancelRequest(rqId) {
  const rq = S.requests.find(r => r.id === rqId);
  if (!rq || rq.status !== 'otevreny') return;
  if (rq.pkg) { const p = P(rq.pkg); p.allocatedTo = null; p.fifoReason = null; hist(p, `Uvolněn – požadavek ${rq.id} zrušen`); }
  rq.status = 'zrusen';
  log(`Požadavek ${rq.id} (${WS[rq.ws]}) zrušen.`);
  commit();
}
function createReceipt(matId, weight) {
  const m = mat(matId);
  const p = newPkg(S, matId, weight, Date.now());
  log(`Přijat ${p.id}: ${m.name}, obal ${m.pack}, ${kg(weight)}.`);
  commit();
  toast(`${p.id} přijat na příjmu`);
}
function commit() { save(); renderAll(); }

/* ---------- tick ---------- */
function tick() {
  const fresh = load(); if (fresh) S = fresh;   // stav mohl změnit jiný panel prohlížeče
  const now = Date.now(); let changed = false;
  if (S.sim.requestAt && !S.sim.fired && now >= S.sim.requestAt) {
    S.sim.fired = true;
    log('Ukázkový scénář: Linka 1 posílá požadavek s limitem 2 minuty.');
    createRequest('L1', 'M01', 2);
  }
  for (const tr of [...S.transports]) {
    if (tr.mode === 'AGV' && now - tr.start >= AGV_MS) { completeTransport(tr.id); changed = true; }
  }
  for (const rq of S.requests) if (rq.status === 'otevreny' && !rq.pkg && allocate(rq)) changed = true;
  if (changed) commit(); else if (tab === 'vedouci' && vedSig() !== lastVedSig) renderAll(); else updateLive();
}
function etaText(tr) {
  const el = Date.now() - tr.start;
  return tr.mode === 'AGV' ? `dorazí za ${Math.max(0, Math.ceil((AGV_MS - el) / 1000))} s`
                           : `jede ${mmss(el)} · čeká na potvrzení`;
}
function cdInfo(rq) {
  if (rq.status === 'doruceno') return {text: rq.onTime ? 'doručeno včas' : 'doručeno po limitu', cls: rq.onTime ? 'ok' : 'late'};
  const rem = rq.created + rq.limit * 60000 - Date.now();
  if (rem >= 0) return {text: `zbývá ${mmss(rem)}`, cls: rem < 60000 ? 'warn' : 'ok'};
  return {text: `po limitu ${mmss(rem)}`, cls: 'late'};
}
function updateLive() {
  const now = Date.now();
  document.querySelectorAll('[data-progress]').forEach(el => {
    const tr = S.transports.find(t => t.id === el.dataset.progress);
    if (tr && tr.mode === 'AGV') el.style.width = Math.min(100, (now - tr.start) / AGV_MS * 100) + '%';
  });
  document.querySelectorAll('[data-eta]').forEach(el => {
    const tr = S.transports.find(t => t.id === el.dataset.eta); if (tr) el.textContent = etaText(tr);
  });
  document.querySelectorAll('[data-countdown]').forEach(el => {
    const rq = S.requests.find(r => r.id === el.dataset.countdown); if (!rq) return;
    const i = cdInfo(rq); el.textContent = i.text; el.className = 'cd ' + i.cls;
    const card = el.closest('.rq'); if (card) card.classList.toggle('late', i.cls === 'late');
  });
  document.querySelectorAll('[data-skcd]').forEach(el => {
    const rq = S.requests.find(r => r.id === el.dataset.skcd); if (!rq) return;
    const c = skCd(rq); el.textContent = c.t; el.className = 'sk-cd ' + c.c;
    const card = el.closest('.sk-card'); if (card) card.classList.toggle('is-late', c.c === 'late');
  });
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('cs-CZ', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
}

/* ---------- vykreslení ---------- */
let tab = 'hala';
function renderAll() {
  const pk = Object.values(S.packages);
  const cnt = s => pk.filter(p => p.state === s).length;
  document.getElementById('kpis').innerHTML =
    `<div><b>${cnt('PRIJEM')}</b>na příjmu</div>
     <div><b>${S.transports.length}</b>na cestě</div>
     <div><b>${cnt('SKLAD')}</b>zaskladněno</div>
     <div><b>${S.requests.filter(r => r.status === 'otevreny' || r.status === 'na_ceste').length}</b>požadavků výroby</div>`;
  const cur = (a, on) => on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
  document.querySelectorAll('.tabs a').forEach(a => cur(a, a.dataset.tab === tab));
  const view = tab === 'skladnik' || tab === 'vedouci' ? tab : 'hala';
  document.querySelectorAll('.viewswitch a').forEach(a => cur(a, a.dataset.view === view));
  document.body.classList.toggle('v-sk', tab === 'skladnik');
  document.body.classList.toggle('v-ved', tab === 'vedouci');
  const app = document.getElementById('app');
  if (tab === 'vedouci') lastVedSig = vedSig();
  app.innerHTML = tab === 'vedouci' ? renderVed() : tab === 'skladnik' ? renderSk() : tab === 'obaly' ? renderPackagesPage() : tab === 'pravidla' ? renderRulesPage() : renderHall();
  updateLive();
}

function renderReceiving() {
  const list = Object.values(S.packages).filter(p => p.state === 'PRIJEM').sort((a, b) => a.receivedAt - b.receivedAt);
  return `<section class="zone" aria-label="Příjem">
    <div class="zone-head"><h2>Příjem</h2><span class="sub">${list.length} obalů</span>
      <button class="btn small" data-action="receipt">Nový příjem</button></div>
    ${list.length ? list.map(p => {
      const m = mat(p.mat), max = PACK[m.pack].max;
      return `<article class="pcard">
        <div class="row"><button class="pid grow" data-action="pkg" data-id="${p.id}">${p.id}</button><span class="pack pack-${m.pack}" title="Obal ${m.pack} – ${PACK[m.pack].desc}">${m.pack}</span></div>

        <div class="meta">${esc(m.cat)} · přijato ${fmt(p.receivedAt)}</div>
        <div class="wbar" title="Hmotnost vůči maximu obalu"><span style="width:${Math.min(100, p.weight / max * 100)}%"></span></div>
        <div class="okline">${kg(p.weight)} z max. ${max} kg – v limitu</div>
        <button class="btn primary" data-action="putaway" data-id="${p.id}">Zaskladnit</button>
      </article>`;
    }).join('') : `<div class="empty">Na příjmu nic nečeká. Přidejte obal tlačítkem Nový příjem.</div>`}
  </section>`;
}
function renderLane(kind) {
  const list = S.transports.filter(t => t.kind === kind || (kind === 'SKLAD' && t.kind === 'PRESUN'));
  const title = kind === 'SKLAD' ? 'do skladu a přeskladnění' : 'Sklad → Výroba';
  return `<section class="lane" aria-label="Na cestě: ${title}">
    <div class="lane-head">Na cestě<span>${title}</span></div>
    ${list.length ? list.map(tr => {
      const p = P(tr.pkg), m = mat(p.mat);
      const pct = tr.mode === 'AGV' ? Math.min(100, (Date.now() - tr.start) / AGV_MS * 100) : 100;
      return `<article class="tcard m-${tr.mode}">
        <div class="row"><button class="pid grow" data-action="pkg" data-id="${p.id}">${p.id}</button><span class="mode ${tr.mode}">${tr.mode === 'AGV' ? 'AGV' : 'Vozík'}</span></div>
        ${tr.kind === 'PRESUN' ? '<span class="badge">Přeskladnění</span>' : ''}
        <div class="pname" style="font-size:13.5px">${esc(m.name)}</div>
        <div class="route">${esc(tr.from)} → <b>${esc(tr.to)}</b></div>
        <div class="prog ${tr.mode === 'AGV' ? '' : 'manual'}"><span data-progress="${tr.id}" style="width:${pct}%"></span></div>
        <div class="meta" data-eta="${tr.id}">${etaText(tr)}</div>
        ${tr.mode === 'RUCNI' ? `<button class="btn small primary" data-action="confirm" data-id="${tr.id}">Potvrdit doručení</button>` : ''}
      </article>`;
    }).join('') : `<div class="empty">Žádný přesun</div>`}
  </section>`;
}
function cellHtml(c) {
  const st = cellStatus(c), mid = cellMaterial(c);
  let body;
  if (!mid) {
    body = `<span class="cmat">volná</span><span class="ccap">${Object.entries(CELLTYPE[c.type].cap).map(([k, v]) => `${v}×${k}`).join(' / ')}</span>`;
  } else {
    const m = mat(mid), cap = CELLTYPE[c.type].cap[m.pack];
    let pips = '';
    for (let i = 0; i < cap; i++) pips += `<span class="pip ${i < c.items.length ? 'on' : i < cellUsed(c) ? 'rs' : ''}"></span>`;
    body = `<span class="cmat">${esc(m.name)}</span><span class="pips" title="${cellUsed(c)} z ${cap} obalů ${m.pack}">${pips}</span>`;
  }
  const alloc = c.items.some(id => P(id).allocatedTo);
  return `<button class="cell ${st}" data-action="cell" data-id="${c.id}" aria-label="${c.id}, ${STATUS_LABEL[st]}">
    <span class="cid">${c.id}</span>${body}${alloc ? '<span class="flag" title="Obal vybrán pro požadavek výroby">FIFO</span>' : ''}</button>`;
}
function renderWarehouse() {
  const tot = S.cells.length, cnt = s => S.cells.filter(c => cellStatus(c) === s).length;
  return `<section class="zone" aria-label="Sklad">
    <div class="zone-head"><h2>Sklad</h2>

/* ---------- pohled Vedoucí ---------- */
const idealType = pack => ORDER[pack][0];
const inLargerCell = () => Object.values(S.packages)
  .filter(p => p.state === 'SKLAD' && cellById(p.cell).type !== idealType(mat(p.mat).pack));

// Návrhy přeskladnění: obal ve větší buňce, pro který se uvolnila menší buňka podle zaskladňovací strategie
function recommendations() {
  const virt = {};
  const used = c => cellUsed(c) + (virt[c.id] ? virt[c.id].n : 0);
  const matOf = c => cellMaterial(c) || (virt[c.id] && virt[c.id].mat);
  const cands = inLargerCell().filter(p => !p.allocatedTo).sort((a, b) =>
    (ORDER[mat(b.mat).pack].indexOf(cellById(b.cell).type) - ORDER[mat(a.mat).pack].indexOf(cellById(a.cell).type)) || (a.storedAt - b.storedAt));
  const out = [];
  for (const p of cands) {
    const m = mat(p.mat), order = ORDER[m.pack], from = cellById(p.cell);
    let to = null, how = '';
    for (const t of order.slice(0, order.indexOf(from.type))) {
      const cap = CELLTYPE[t].cap[m.pack], cs = S.cells.filter(c => c.type === t);
      const same = cs.find(c => used(c) > 0 && matOf(c) === p.mat && used(c) < cap);
      if (same) { to = same; how = 'same'; break; }
      const empty = cs.find(c => used(c) === 0);
      if (empty) { to = empty; how = 'empty'; break; }
    }
    if (!to) continue;
    const key = p.id + '>' + to.id;
    if (S.dismissed.includes(key)) continue;
    virt[to.id] = {n: (virt[to.id] ? virt[to.id].n : 0) + 1, mat: p.mat};
    const it = idealType(m.pack), rest = from.items.length - 1;
    const reason = `${p.id} (${m.name}, obal ${m.pack}) je v ${from.id} – ${CELLTYPE[from.type].name}, typ ${from.type}. Pro obal ${m.pack} je ideální typ ${it} – ${CELLTYPE[it].name}. ` +
      (how === 'same' ? `V ${to.id} už je stejný materiál a zbývá v ní místo, má proto přednost.`
                      : `Buňka ${to.id} (${CELLTYPE[to.type].name}, typ ${to.type}) je volná a je první vhodnou menší buňkou podle strategie.`) +
      (rest ? ` V ${from.id} zůstane ${rest} obal stejného materiálu.` : ` Buňka ${from.id} se uvolní pro větší obaly.`);
    out.push({key, pkg: p, from, to, reason});
  }
  return out;
}
function startRelocation(pkgId, toId, mode) {
  const p = P(pkgId), to = cellById(toId);
  const rec = recommendations().find(r => r.pkg.id === pkgId && r.to.id === toId);
  if (!p || p.state !== 'SKLAD' || p.allocatedTo || !rec) { toast('Doporučení už neplatí – stav skladu se mezitím změnil.', 'err'); renderAll(); return; }
  const from = cellById(p.cell);
  from.items = from.items.filter(x => x !== p.id);
  to.reserved.push(p.id);
  p.fromCell = from.id; p.cell = null; p.target = to.id; p.state = 'CESTA_SKLAD'; p.relocating = true; p.simOrd = null;
  p.putReason = {summary: `Přeskladnění z ${from.id} do ${to.id} (doporučení přijato vedoucím)`, steps: [rec.reason]};
  hist(p, `Přeskladnění ${from.id} → ${to.id}, buňka ${to.id} rezervována; přeprava: ${MODES[mode]}`);
  S.transports.push({id: 'T' + (++S.seq.tr), pkg: p.id, kind: 'PRESUN', mode, start: Date.now(), from: from.id, to: to.id});
  log(`Vedoucí přijal doporučení: ${p.id} se přeskladňuje z ${from.id} do ${to.id} (${MODES[mode]}).`);
  commit();
  toast(`Přeskladnění ${p.id}: ${from.id} → ${to.id} zahájeno`);
}
function atRisk() {
  const now = Date.now();
  return S.requests.filter(r => r.status === 'otevreny' || r.status === 'na_ceste').map(r => {
    const rem = skDeadline(r) - now;
    const why = rem < 0 ? 'po limitu' : rem < 60000 ? 'méně než minuta do limitu'
      : (r.status === 'otevreny' && !r.pkg) ? 'materiál není skladem' : null;
    return why && {r, why, rem};
  }).filter(Boolean).sort((a, b) => a.rem - b.rem);
}

    <div class="meta">Aplikace vybere obal podle FIFO a ukáže, proč ho vybrala.</div>
    <div class="field"><label for="r-mat">Materiál</label><select id="r-mat">${opts}</select></div>
    <div class="field"><label for="r-lim">Časový limit doručení (min)</label><input id="r-lim" type="number" min="1" max="240" step="1" value="5"></div>
    <div class="foot"><button class="btn" data-action="close">Zrušit</button><button class="btn primary" id="r-ok">Vyžádat materiál</button></div>`,
  el => {
    el.querySelector('#r-ok').addEventListener('click', () => {
      let lim = parseInt(el.querySelector('#r-lim').value, 10); if (!(lim > 0)) lim = 5;
      const mid = el.querySelector('#r-mat').value; closeModal(); createRequest(ws, mid, Math.min(lim, 240));
    });
  });
}
function cellModal(id) {
  const c = cellById(id), st = cellStatus(c), mid = cellMaterial(c), m = mid && mat(mid);
  const row = (pid, extra) => { const p = P(pid); return `<tr class="clk" data-action="pkg" data-id="${pid}"><td><b>${pid}</b></td><td>${extra(p)}</td></tr>`; };
  openModal(`<button class="btn ghost x" data-action="close" aria-label="Zavřít">✕</button>
    <h2>Buňka ${c.id}</h2>
    <dl class="kv">
      <dt>Typ</dt><dd>${c.type} – ${CELLTYPE[c.type].name}</dd>
      <dt>Kapacita</dt><dd>${Object.entries(CELLTYPE[c.type].cap).map(([k, v]) => `${v}× obal ${k}`).join(', ')}</dd>
      <dt>Stav</dt><dd>${STATUS_LABEL[st]}</dd>
      <dt>Materiál</dt><dd>${m ? `${esc(m.name)} (obal ${m.pack}) – obsazeno ${cellUsed(c)} z ${CELLTYPE[c.type].cap[m.pack]}` : '–'}</dd>
    </dl>
    ${c.items.length ? `<h3 style="font-size:17px">Uložené obaly</h3><div class="tw"><table><tbody>${c.items.map(pid => row(pid, p => `zaskladněn ${fmt(p.storedAt)} · ${dur(Date.now() - p.storedAt)} ve skladu${p.allocatedTo ? ` · vybrán pro ${p.allocatedTo}` : ''}`)).join('')}</tbody></table></div>` : ''}
    ${c.reserved.length ? `<h3 style="font-size:17px;margin-top:10px">Rezervace</h3><div class="tw"><table><tbody>${c.reserved.map(pid => row(pid, () => (P(pid).relocating ? `přeskladnění z ${P(pid).fromCell}` : 'obal je na cestě z příjmu'))).join('')}</tbody></table></div>` : ''}
    ${!c.items.length && !c.reserved.length ? '<p class="meta">Buňka je prázdná.</p>' : ''}`);
}
function pkgModal(id) {
  const p = P(id); if (!p) return; const m = mat(p.mat);
  openModal(`<button class="btn ghost x" data-action="close" aria-label="Zavřít">✕</button>
    <h2>Obal ${p.id}</h2>
    <dl class="kv">
      <dt>Materiál</dt><dd>${esc(m.name)} (${esc(m.cat)})</dd>
      <dt>Obal</dt><dd><span class="pack pack-${m.pack}">${m.pack}</span> ${PACK[m.pack].desc}, max. ${PACK[m.pack].max} kg</dd>
      <dt>Hmotnost</dt><dd>${kg(p.weight)}</dd>
      <dt>Stav</dt><dd><span class="st ${p.state}">${STATES[p.state]}</span></dd>
      <dt>Umístění</dt><dd>${esc(location_(p))}</dd>
      ${p.storedAt ? `<dt>Zaskladněno</dt><dd>${fmt(p.storedAt)}</dd>` : ''}
    </dl>
    ${p.putReason ? `<h3 style="font-size:17px">Proč buňka ${p.target}</h3><div class="why"><b>${esc(p.putReason.summary)}</b>${p.putReason.steps.length ? `<ol class="steps">${p.putReason.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : ''}</div>` : ''}
    ${p.fifoReason ? `<h3 style="font-size:17px;margin-top:10px">Proč vybrán pro výrobu (FIFO)</h3><div class="why">${esc(p.fifoReason)}</div>` : ''}
    <h3 style="font-size:17px;margin-top:12px">Historie</h3>
    <div class="hist">${p.history.map(h => `<div><time>${fmt(h.t)}</time><span class="st ${h.state}">${STATES[h.state]}</span> ${esc(h.note)}</div>`).join('')}</div>`);
}
function resetModal() {
  openModal(`<h2>Obnovit ukázková data?</h2>
    <p>Všechny změny se smažou a sklad, příjem i výroba se vrátí do výchozího stavu.</p>
    <div class="foot"><button class="btn" data-action="close">Zrušit</button><button class="btn primary" data-action="reset">Obnovit ukázková data</button></div>`);
}

function toast(text, kind = '') {
  if (tab === 'skladnik') return;
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = text;
  document.getElementById('toasts').appendChild(el); setTimeout(() => el.remove(), 4200);
}

/* ---------- události ---------- */
document.addEventListener('click', e => {
  if (e.target.matches('[data-backdrop]')) { closeModal(); return; }
  const a = e.target.closest('[data-action]'); if (!a) return;
  const {action, id, mode, ws, key} = a.dataset;
  switch (action) {
    case 'putaway': putawayModal(id); break;
    case 'putaway-go': closeModal(); startPutaway(id, mode); break;
    case 'confirm': completeTransport(id); break;
    case 'receipt': receiptModal(); break;
    case 'request': requestModal(ws); break;
    case 'dispatch': dispatch(id, mode); break;
    case 'cancel-req': cancelRequest(id); break;
    case 'cell': cellModal(id); break;
    case 'pkg': pkgModal(id); break;
    case 'close': closeModal(); break;
    case 'reset-ask': resetModal(); break;
    case 'reset':
      S = sampleState(); closeModal(); skClear(); ui.screen = 'list'; ui.scanned = {}; ui.known = null;
      commit(); if (tab === 'skladnik') skFlash('ok', 'Ukázková data obnovena', 'Sklad, úkoly, pořadí skenování i časovaný požadavek jsou ve výchozím stavu.'); else toast('Ukázková data obnovena');
      break;
    case 'sk-open': ui.screen = key; skClearAlert(); renderAll(); window.scrollTo(0, 0); break;
    case 'rec-accept': startRelocation(id, key, mode); break;
    case 'rec-dismiss': S.dismissed.push(key); log(`Vedoucí skryl doporučení ${key.replace('>', ' → ')}.`); commit(); break;
    case 'sk-back': ui.screen = 'list'; renderAll(); break;
    case 'sk-scan': skScan(); break;
    case 'sk-mode': skMode(mode); break;
    case 'sk-deliver': skDeliver(); break;
    case 'sk-flash-close': document.getElementById('sk-flash').innerHTML = ''; break;
    case 'sk-alert-close': skClearAlert(); break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
const isPhone = () => matchMedia('(max-width: 760px), (pointer: coarse) and (max-width: 1024px)').matches;
function route() {
  const h = location.hash.replace('#', '');
  tab = ['hala', 'obaly', 'pravidla', 'skladnik', 'vedouci'].includes(h) ? h : (isPhone() ? 'skladnik' : 'hala');
  if (tab !== 'skladnik') skClear();
  renderAll();
}
window.addEventListener('hashchange', route);
window.addEventListener('storage', e => {
  if (e.key !== STORAGE_KEY || !e.newValue) return;
  try { S = JSON.parse(e.newValue); if (!S.sim) S.sim = defaultSim(); renderAll(); } catch (err) {}
});

try {
  S = load() || sampleState();
  route();
} catch (e) {
  console.error(e);
  S = sampleState();
  route();
  toast('Uložená data nešla načíst – načtena ukázková data.', 'err');
}
save();
setInterval(() => { try { tick(); } catch (e) { console.error(e); } }, 500);
</script>
</body>
</html>
